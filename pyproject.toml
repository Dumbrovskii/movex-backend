[project]
name = "movex-backend"
version = "0.1.0"
description = "Backend service for Movex"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.5",
    "redis>=8.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "geoalchemy2>=0.20.0",
    "shapely>=2.1.2",
    "asyncpg>=0.31.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
